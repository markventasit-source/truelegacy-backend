
name: Deploy True Legacy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest

    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
      ENV_FILE_PATH: /home/truelegacyadmin/true-legacy/.env/.env.development
      PROJECT_DIR: /home/truelegacyadmin/true-legacy-backend
      APP_NAME: true-legacy-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to Linode
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SERVER_IP }}
          username: ${{ env.SERVER_USER }}
          password: ${{ env.SERVER_PASSWORD }}
          port: 4967
          script: |
            # Verify Node.js and npm installation
            node -v || { echo "Node.js not found"; exit 1; }
            npm -v || { echo "npm not found"; exit 1; }

            # Install PM2 globally if not installed
            if ! command -v pm2 &> /dev/null; then
              sudo npm install -g pm2
            fi

            # Clone the repository or pull the latest changes using GH_PAT
            if [ -d "${{ env.PROJECT_DIR }}" ]; then
              cd ${{ env.PROJECT_DIR }}
              git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git
              git pull origin main
            else
              git clone https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }} ${{ env.PROJECT_DIR }}
              cd ${{ env.PROJECT_DIR }}
            fi

            # Install dependencies
            npm install

            # Copy environment file
            if [ -f "${{ env.ENV_FILE_PATH }}" ]; then
              cp ${{ env.ENV_FILE_PATH }} .env
            else
              echo ".env file missing at ${{ env.ENV_FILE_PATH }}"
              exit 1
            fi

            # Restart the application with PM2
            pm2 delete ${{ env.APP_NAME }} || true
            pm2 start npm --name ${{ env.APP_NAME }} -- run start
            pm2 save
